<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | SSC With Jagrat</title>
  <link rel="stylesheet" href="assets/style.css"><script src="assets/theme.js"></script>
  <link rel="icon" href="assets/icons/icon-192.png">
</head>
<body class="center">
  <section class="auth-card">
    <div class="logo big"><img src="assets/icons/logo-header.png" alt="SSC With Jagrat"></div>
    <h1>Reset Password</h1>
    <p>Set a new password for your SSC With Jagrat account.</p>

    <form id="resetForm" class="account-form">
      <input id="newPassword" type="password" placeholder="New password (min 6 characters)" minlength="6" required>
      <input id="confirmPassword" type="password" placeholder="Confirm new password" minlength="6" required>
      <button>UPDATE PASSWORD</button>
    </form>
    <div id="resetMsg" class="msg"></div>
    <a href="account.html?tab=login">← Back to Login</a>
  </section>
  <script type="module" src="assets/reset-password.js"></script>
<script src="assets/pwa.js"></script></body>
</html>
